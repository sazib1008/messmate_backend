spring.application.name=messmate_backend
server.port=${PORT:${SERVER_PORT:8080}}

# Database Configuration (PostgreSQL / Neon)
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-falling-feather-b354yldv-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&prepareThreshold=0}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_CdV3Nl1AqrGW}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:60000}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# JWT Security
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:604800000}

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.example.messmate_backend=INFO
