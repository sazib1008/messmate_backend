spring.application.name=messmate_backend_test

# H2 In-Memory Database for Hermetic, Self-Contained Testing
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate DDL
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test JWT Secret (at least 256 bits)
jwt.secret=test_secure_secret_key_for_unit_tests_must_be_256_bits_long_abcdef1234567890
jwt.expiration=86400000

# CORS Test Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Logging
logging.level.org.springframework=WARN
logging.level.com.example.messmate_backend=WARN
